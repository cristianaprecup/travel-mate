version: '3.8'

services:
  # Service 1
  trip-service:
    build: ./trip-service
    container_name: trip-service
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SEARCH_SERVICE_URL=http://search-service:8081/api/search
      - RANKING_SERVICE_URL=http://ranking-service:8082/api/rank
    depends_on:
      - search-service
      - ranking-service
    networks:
      - travel-mate-network

  # Service 2
  search-service:
    build: ./search-service
    container_name: search-service
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
    networks:
      - travel-mate-network

  # Service 3
  ranking-service:
    build: ./ranking-service
    container_name: ranking-service
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
    networks:
      - travel-mate-network

networks:
  travel-mate-network:
    driver: bridge